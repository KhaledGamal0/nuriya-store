name: Sales report

# E-mails ORDER_ALERT_EMAIL a formatted sales report. Sent on time by "Reports clock" (Cairo time, Oct 27 2026):
#   daily   every morning 09:00   yesterday vs the day before + today so far, orders to confirm, low stock, stock
#   weekly  Sunday 09:00          last 7 full days vs the 7 before, best seller, areas, day by day
#   monthly the 1st 09:00         last month vs the month before
# Also on demand: Actions → Sales report → Run workflow (choose the report).
on:
  workflow_dispatch:
    inputs:
      report:
        description: "Which report"
        type: choice
        options: [daily, weekly, monthly]
        default: daily

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ORDER_ALERT_EMAIL: ${{ secrets.ORDER_ALERT_EMAIL }}
      MODE: ${{ inputs.report || 'daily' }}
      SITE: ${{ vars.SITE_URL || 'https://nuriya.app' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Database address (masked)
        run: node scripts/neon.mjs env production
      - name: Sales numbers (no customer phones)
        run: docker run --rm --network host -e DATABASE_URL -e MODE -v "$PWD/scripts:/s:ro" postgres:17 psql "$DATABASE_URL" -tA -v ON_ERROR_STOP=1 -v mode="$MODE" -f /s/sales.sql > sales.json
      - name: One-time e-mail pass (the site sends the report with its own Resend key)
        continue-on-error: true
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          docker run --rm --network host -e DATABASE_URL postgres:17 psql "$DATABASE_URL" -q -c "INSERT INTO refresh_tokens (token) VALUES ('$TOKEN')"
          echo "REPORT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Write and e-mail the report
        run: node scripts/sales-report.mjs
      - name: Keep the latest report on the sales-report branch (never deployed)
        run: |
          mkdir -p out && cp report.txt out/ && cd out && echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b sales-report && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "Sales report ${GITHUB_RUN_ID}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sales-report
