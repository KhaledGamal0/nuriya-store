name: Admin tasks

# Shop tasks you can run from your phone (GitHub → Actions → Admin tasks → Run workflow) until the admin
# dashboard exists. mark-delivered: every open order placed until now (waiting, confirmed, packed, with courier)
# becomes DELIVERED and, for cash on delivery, PAID (cash collected). confirm-orders: marks every order waiting for confirmation (placed until now) as CONFIRMED,
# after Khaled confirmed them with the customers on WhatsApp. Every task: takes an encrypted backup first, changes the live database in ONE
# transaction (all or nothing), then refreshes the live site so customers see the change at once.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        options: ["set-stock", "take-out-stock", "confirm-orders", "mark-delivered", "start-offer", "start-sale", "end-offers", "reset-test-orders", "refresh-site"]
        default: "set-stock"
      cream_sm:
        description: "set-stock: Cream S/M pieces available now · take-out-stock: Cream S/M pieces to remove (gift, damaged)"
        default: ""
      cream_lxl:
        description: "set-stock: Cream L/XL pieces available now · take-out-stock: Cream L/XL pieces to remove (gift, damaged)"
        default: ""
      burgundy_sm:
        description: "set-stock: Burgundy S/M pieces available now · take-out-stock: Burgundy S/M pieces to remove (gift, damaged)"
        default: ""
      burgundy_lxl:
        description: "set-stock: Burgundy L/XL pieces available now · take-out-stock: Burgundy L/XL pieces to remove (gift, damaged)"
        default: ""
      confirm:
        description: 'reset-test-orders: type DELETE ALL ORDERS to confirm'
        default: ""
      price:
        description: "start-offer: offer price in EGP (e.g. 1000) · start-sale: sale price in EGP (e.g. 900)"
        default: ""
      was:
        description: "start-offer: old price shown crossed out, EGP (e.g. 1200); blank = none"
        default: ""
      pieces:
        description: "start-offer: how many pieces at the offer price, all customers together (e.g. 7); blank = no limit"
        default: ""
      ends:
        description: "start-sale: last day of the sale, YYYY-MM-DD (ends 11:59 pm Cairo that day)"
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: admin-tasks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SITE: ${{ vars.SITE_URL || 'https://nuriya.app' }}
      TASK: ${{ inputs.task }}
      CREAM_SM: ${{ inputs.cream_sm }}
      CREAM_LXL: ${{ inputs.cream_lxl }}
      BURGUNDY_SM: ${{ inputs.burgundy_sm }}
      BURGUNDY_LXL: ${{ inputs.burgundy_lxl }}
      CONFIRM: ${{ inputs.confirm }}
      PRICE: ${{ inputs.price }}
      WAS: ${{ inputs.was }}
      PIECES: ${{ inputs.pieces }}
      ENDS: ${{ inputs.ends }}
    steps:
      - name: Check the request before touching anything
        run: |
          [ -n "$NEON_API_KEY" ] && [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::NEON_API_KEY and BACKUP_PASSPHRASE secrets are required."; exit 1; }
          if [ "$TASK" = "set-stock" ]; then
            for v in "$CREAM_SM" "$CREAM_LXL" "$BURGUNDY_SM" "$BURGUNDY_LXL"; do
              [[ "$v" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Each stock count must be a whole number 0–99999 (got '$v')."; exit 1; }
            done
          elif [ "$TASK" = "take-out-stock" ]; then
            for v in "${CREAM_SM:-0}" "${CREAM_LXL:-0}" "${BURGUNDY_SM:-0}" "${BURGUNDY_LXL:-0}"; do
              [[ "$v" =~ ^[0-9]{1,3}$ ]] || { echo "::error::Pieces to take out must be a whole number 0–999 (got '$v')."; exit 1; }
            done
          elif [ "$TASK" = "start-offer" ]; then
            [[ "$PRICE" =~ ^[0-9]{2,5}$ ]] || { echo "::error::Offer price must be a whole number of EGP, e.g. 1000."; exit 1; }
            [ -z "$WAS" ] || { [[ "$WAS" =~ ^[0-9]{2,5}$ ]] && [ "$WAS" -gt "$PRICE" ]; } || { echo "::error::Old price must be a whole number of EGP, higher than the offer price (or blank)."; exit 1; }
            [ -z "$PIECES" ] || [[ "$PIECES" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::Pieces must be a whole number 1–9999 (or blank for no limit)."; exit 1; }
            [ -z "$PIECES" ] || [ -n "$WAS" ] || { echo "::error::A piece limit needs the old price (the price after the offer pieces run out)."; exit 1; }
          elif [ "$TASK" = "start-sale" ]; then
            [[ "$PRICE" =~ ^[0-9]{2,5}$ ]] || { echo "::error::Sale price must be a whole number of EGP, e.g. 900."; exit 1; }
            [[ "$ENDS" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]] || { echo "::error::Sale end must be a date like 2026-10-30."; exit 1; }
          elif [ "$TASK" = "reset-test-orders" ]; then
            [ "$CONFIRM" = "DELETE ALL ORDERS" ] || { echo "::error::To delete all orders, type DELETE ALL ORDERS in the confirm box."; exit 1; }
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Database address (masked)
        run: node scripts/neon.mjs env production
      - name: Backup first (encrypted)
        if: inputs.task != 'refresh-site'
        run: |
          echo "STAMP=$(date -u +%F-%H%M)" >> "$GITHUB_ENV"
          docker run --rm --network host --user "$(id -u):$(id -g)" -e DATABASE_URL -v "$PWD:/out" postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges -d "$DATABASE_URL" -f /out/before.dump'
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o before.dump.gpg before.dump
          rm -f before.dump
      - uses: actions/upload-artifact@v4
        if: inputs.task != 'refresh-site'
        with:
          name: before-${{ inputs.task }}-${{ env.STAMP }}
          path: before.dump.gpg
          retention-days: 90
      - name: Apply (one transaction)
        if: inputs.task != 'refresh-site'
        run: |
          if [ "$TASK" = "set-stock" ]; then
            cat > task.sql <<SQL
          BEGIN;
          -- "Available to sell now": pieces already promised to open orders stay reserved on top.
          UPDATE variants SET track_inventory = true, stock_on_hand = stock_reserved + ${CREAM_SM}    WHERE sku = 'NUR-QC-CRM-SM';
          UPDATE variants SET track_inventory = true, stock_on_hand = stock_reserved + ${CREAM_LXL}   WHERE sku = 'NUR-QC-CRM-LXL';
          UPDATE variants SET track_inventory = true, stock_on_hand = stock_reserved + ${BURGUNDY_SM} WHERE sku = 'NUR-QC-BRG-SM';
          UPDATE variants SET track_inventory = true, stock_on_hand = stock_reserved + ${BURGUNDY_LXL} WHERE sku = 'NUR-QC-BRG-LXL';
          DO \$\$ BEGIN IF (SELECT count(*) FROM variants WHERE track_inventory) < 4 THEN RAISE EXCEPTION 'not every size was updated'; END IF; END \$\$;
          COMMIT;
          SQL
          elif [ "$TASK" = "take-out-stock" ]; then
            cat > task.sql <<SQL
          BEGIN;
          -- Pieces leaving without an order (gift, UGC, damaged): subtract only what was asked, never below 0 (stops instead).
          UPDATE variants SET stock_on_hand = stock_on_hand - ${CREAM_SM:-0}    WHERE sku = 'NUR-QC-CRM-SM';
          UPDATE variants SET stock_on_hand = stock_on_hand - ${CREAM_LXL:-0}   WHERE sku = 'NUR-QC-CRM-LXL';
          UPDATE variants SET stock_on_hand = stock_on_hand - ${BURGUNDY_SM:-0} WHERE sku = 'NUR-QC-BRG-SM';
          UPDATE variants SET stock_on_hand = stock_on_hand - ${BURGUNDY_LXL:-0} WHERE sku = 'NUR-QC-BRG-LXL';
          DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM variants WHERE stock_on_hand - stock_reserved < 0) THEN RAISE EXCEPTION 'that would make stock negative'; END IF; END \$\$;
          INSERT INTO audit_log (actor, action, entity, entity_id, after)
          VALUES ('khaled', 'take_out_stock', 'variants', 'NUR-QC',
                  json_build_object('white_sm', ${CREAM_SM:-0}, 'white_lxl', ${CREAM_LXL:-0}, 'burgundy_sm', ${BURGUNDY_SM:-0}, 'burgundy_lxl', ${BURGUNDY_LXL:-0})::jsonb);
          COMMIT;
          SQL
          elif [ "$TASK" = "start-offer" ]; then
            # New regular offer from now: price, optional crossed-out old price, optional piece limit (all customers).
            # Ends any timed sale. When the pieces run out the old price applies by itself (lib/orders.ts).
            WAS_SQL=${WAS:+$((WAS * 100))}; PIECES_SQL=${PIECES:-NULL}
            cat > task.sql <<SQL
          BEGIN;
          INSERT INTO audit_log (actor, action, entity, entity_id, before)
          SELECT 'khaled', 'start_offer', 'product', slug, to_jsonb(p) - 'details_en' - 'details_ar' FROM products p WHERE slug = 'quiet-confidence';
          UPDATE products SET price_piasters = $((PRICE * 100)), compare_at_piasters = ${WAS_SQL:-NULL},
                 offer_pieces_limit = ${PIECES_SQL}, offer_orders_limit = NULL, offer_started_at = now(),
                 sale_price_piasters = NULL, sale_starts_at = NULL, sale_ends_at = NULL, updated_at = now()
          WHERE slug = 'quiet-confidence';
          COMMIT;
          SQL
          elif [ "$TASK" = "start-sale" ]; then
            # Timed sale on top of the current price/offer: starts now, ends at 11:59 pm Cairo on the given day,
            # then the current price/offer comes back by itself. Sale pieces don't use up a piece-limited offer.
            cat > task.sql <<SQL
          BEGIN;
          INSERT INTO audit_log (actor, action, entity, entity_id, before)
          SELECT 'khaled', 'start_sale', 'product', slug, to_jsonb(p) - 'details_en' - 'details_ar' FROM products p WHERE slug = 'quiet-confidence';
          UPDATE products SET sale_price_piasters = $((PRICE * 100)), sale_starts_at = now(),
                 sale_ends_at = ('${ENDS} 23:59:00')::timestamp AT TIME ZONE 'Africa/Cairo', updated_at = now()
          WHERE slug = 'quiet-confidence';
          DO \$\$ BEGIN
            IF (SELECT sale_ends_at <= now() FROM products WHERE slug = 'quiet-confidence') THEN RAISE EXCEPTION 'the sale end date is in the past'; END IF;
            IF (SELECT sale_price_piasters >= price_piasters FROM products WHERE slug = 'quiet-confidence') THEN RAISE EXCEPTION 'the sale price must be lower than the current price'; END IF;
          END \$\$;
          COMMIT;
          SQL
          elif [ "$TASK" = "end-offers" ]; then
            # Back to the normal price now: the crossed-out price (if any) becomes the price; no offer, no sale.
            cat > task.sql <<'SQL'
          BEGIN;
          INSERT INTO audit_log (actor, action, entity, entity_id, before)
          SELECT 'khaled', 'end_offers', 'product', slug, to_jsonb(p) - 'details_en' - 'details_ar' FROM products p WHERE slug = 'quiet-confidence';
          UPDATE products SET price_piasters = coalesce(compare_at_piasters, price_piasters), compare_at_piasters = NULL,
                 offer_pieces_limit = NULL, offer_orders_limit = NULL,
                 sale_price_piasters = NULL, sale_starts_at = NULL, sale_ends_at = NULL, updated_at = now()
          WHERE slug = 'quiet-confidence';
          COMMIT;
          SQL
          elif [ "$TASK" = "mark-delivered" ]; then
            cat > task.sql <<'SQL'
          BEGIN;
          -- Delivered and (cash on delivery) paid: every open order placed until now. History line + audit each.
          WITH done AS (
            UPDATE orders SET status = 'DELIVERED',
                   payment_status = CASE WHEN payment_method = 'cod' THEN 'PAID' ELSE payment_status END, updated_at = now()
            WHERE status IN ('CONFIRMATION_NEEDED', 'CONFIRMED', 'PACKED', 'WITH_COURIER') AND created_at <= now()
            RETURNING id, number)
          , ev AS (
            INSERT INTO order_events (order_id, type, data, actor)
            SELECT id, 'status_changed', '{"to":"DELIVERED","how":"confirmed on WhatsApp and delivered (Khaled)"}', 'khaled'
            FROM done RETURNING order_id)
          INSERT INTO audit_log (actor, action, entity, entity_id, after)
          SELECT 'khaled', 'mark_delivered', 'order', number, '{"status":"DELIVERED"}' FROM done;
          COMMIT;
          SQL
          elif [ "$TASK" = "confirm-orders" ]; then
            cat > task.sql <<'SQL'
          BEGIN;
          -- Orders confirmed with the customer on WhatsApp: CONFIRMATION_NEEDED → CONFIRMED, with a history line each.
          WITH done AS (
            UPDATE orders SET status = 'CONFIRMED', updated_at = now()
            WHERE status = 'CONFIRMATION_NEEDED' AND created_at <= now()
            RETURNING id, number)
          , ev AS (
            INSERT INTO order_events (order_id, type, data, actor)
            SELECT id, 'status_changed', '{"from":"CONFIRMATION_NEEDED","to":"CONFIRMED","how":"confirmed with the customer on WhatsApp"}', 'khaled'
            FROM done RETURNING order_id)
          INSERT INTO audit_log (actor, action, entity, entity_id, before, after)
          SELECT 'khaled', 'confirm_order', 'order', number, '{"status":"CONFIRMATION_NEEDED"}', '{"status":"CONFIRMED"}' FROM done;
          COMMIT;
          SQL
          else
            cat > task.sql <<'SQL'
          BEGIN;
          DELETE FROM payments;
          DELETE FROM order_events;
          DELETE FROM order_items;
          DELETE FROM orders;
          DELETE FROM customers;
          DELETE FROM rate_limits;
          UPDATE variants SET stock_reserved = 0;
          COMMIT;
          SQL
          fi
          docker run --rm --network host -e DATABASE_URL -v "$PWD:/w" postgres:17 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f /w/task.sql
          docker run --rm --network host -e DATABASE_URL postgres:17 psql "$DATABASE_URL" -tA -F ' ' -c \
            "SELECT sku, stock_on_hand - stock_reserved, stock_reserved FROM variants ORDER BY sku" | while read sku avail reserved; do
              echo "::notice::$sku — available $avail, reserved for open orders $reserved"
            done
          docker run --rm --network host -e DATABASE_URL postgres:17 psql "$DATABASE_URL" -tA -c "SELECT 'orders in database: ' || count(*) FROM orders" | sed 's/^/::notice::/'
          docker run --rm --network host -e DATABASE_URL postgres:17 psql "$DATABASE_URL" -tA -c "SELECT 'price now: ' || price_piasters/100 || ' EGP' || coalesce(' · crossed out: ' || compare_at_piasters/100, '') || coalesce(' · offer pieces: ' || offer_pieces_limit, '') || coalesce(' · sale: ' || sale_price_piasters/100 || ' until ' || to_char(sale_ends_at AT TIME ZONE 'Africa/Cairo', 'Dy DD Mon HH24:MI') || ' Cairo', '') FROM products WHERE slug = 'quiet-confidence'" | sed 's/^/::notice::/'
          docker run --rm --network host -e DATABASE_URL postgres:17 psql "$DATABASE_URL" -tA -c "SELECT status || ': ' || count(*) || ' (' || string_agg(number, ', ' ORDER BY created_at) || ')' FROM orders GROUP BY status" | sed 's/^/::notice::/'
      - name: Refresh the live site
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          docker run --rm --network host -e DATABASE_URL postgres:17 psql "$DATABASE_URL" -q -c "INSERT INTO refresh_tokens (token) VALUES ('$TOKEN')"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" "$SITE/api/revalidate")
          [ "$code" = "200" ] || { echo "::error::Site refresh returned $code. The change is saved; pages update on the next deploy."; exit 1; }
          echo "::notice::Live site refreshed."
      - name: Also reset the preview (test) database
        if: inputs.task == 'reset-test-orders'
        run: node scripts/neon.mjs env preview
      - name: Reset preview orders
        if: inputs.task == 'reset-test-orders'
        run: docker run --rm --network host -e DATABASE_URL -v "$PWD:/w" postgres:17 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f /w/task.sql
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/alert.sh open "Admin task failed" "The '${{ inputs.task }}' task stopped. The database change is all-or-nothing, so nothing was half-applied. A backup was taken first."
