name: Live photo speed

# Opens the live shop as a first-time iPhone visitor (empty cache) and reports how long until every
# photo shows, and whether each photo came from Vercel's edge cache. Runs after every push to main
# (once the deploy is live) and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: ${{ vars.SITE_URL || 'https://nuriya.app' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for the deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            s=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/statuses -q '[.[]|select(.context=="Vercel")][0].state')
            echo "Vercel: $s"; [ "$s" = success ] && exit 0; [ "$s" = failure ] && exit 1; sleep 15
          done
      - run: npm install --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - run: mkdir -p out && node scripts/live-photos.mjs | tee out/live-photos.txt
      - name: Publish result to the live-photos branch (never deployed)
        run: |
          cd out && echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b live-photos && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "Live photo speed for ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-photos
