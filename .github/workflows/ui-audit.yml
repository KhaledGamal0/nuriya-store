name: UI audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nuriya
          POSTGRES_PASSWORD: nuriya
          POSTGRES_DB: nuriya
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuriya" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nuriya:nuriya@localhost:5432/nuriya
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright @axe-core/playwright lighthouse
          npx playwright install --with-deps chromium
      - name: Build and start
        run: |
          npm run db:migrate
          npm run db:seed
          npm run build
          mkdir -p ui-report
          STORE_DEBUG=1 REVALIDATE_SECRET=audit-secret npx next start -p 3000 > ui-report/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
      - name: Audit
        env:
          REVALIDATE_SECRET: audit-secret
        run: node scripts/ui-audit.mjs
      - name: Lighthouse (mobile, simulated 4G)
        run: node scripts/lighthouse.mjs
      - name: Database-down drill
        # A second copy of the same build on port 3001, pointed at a port where no database listens.
        env:
          BASE_URL: http://localhost:3001
        run: |
          DATABASE_URL=postgresql://nuriya:nuriya@localhost:5999/nuriya npx next start -p 3001 > ui-report/server-outage.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001 >/dev/null && break; sleep 2; done
          node scripts/outage-check.mjs
      - name: Publish report to the ui-report branch
        if: always()
        run: |
          cp package-lock.json ui-report/ 2>/dev/null || true
          cd ui-report
          git init -q -b ui-report
          git config user.name "ui-audit"
          git config user.email "ui-audit@users.noreply.github.com"
          git add -A
          git commit -q -m "UI audit for ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ui-report
